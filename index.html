<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的報告作品集</title>
    <style>
        /* 基礎樣式設定 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            line-height: 1.6;
            background-color: #f4f7f6;
        }

        /* 導覽列 */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
        }

        nav li {
            position: relative;
            margin-left: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #1abc9c;
        }

        /* 下拉選單樣式 */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            top: 100%;
            left: 0;
            border-radius: 4px;
        }

        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* 主內容區塊 */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #1abc9c, #3498db);
            color: white;
            border-radius: 10px;
            margin-bottom: 40px;
        }

        /* 報告卡片樣式 */
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        /* 按鈕樣式 */
        .btn {
            display: inline-block;
            background-color: #1abc9c;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #16a085;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">個人報告集</div>
        <nav>
            <ul>
                <li><a href="#">首頁</a></li>
                <li class="dropdown">
                    <a href="#">學術報告 ▾</a>
                    <div class="dropdown-content">
                        <a href="#science">科學類</a>
                        <a href="#history">歷史類</a>
                        <a href="#business">商管類</a>
                    </div>
                </li>
                <li class="dropdown">
                    <a href="#">專案類型 ▾</a>
                    <div class="dropdown-content">
                        <a href="#">個人研究</a>
                        <a href="#">團隊合作</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1>歡迎來到我的知識庫</h1>
            <p>這裡收錄了我過去所有的研究心得與專案報告</p>
        </section>

        <h2 id="science">精選報告</h2>
        <div class="report-grid">
            <div class="card">
                <h3>2024 市場趨勢分析</h3>
                <p>這份報告深入探討了 AI 技術對零售業的影響，並提出了三種未來發展模型。</p>
                <button class="btn" onclick="alert('連結至你的 PDF 檔案')">閱讀全文</button>
            </div>

            <div class="card">
                <h3>環境永續研究</h3>
                <p>針對城市減碳政策的實踐案例進行比較研究，包含台北與東京的對比。</p>
                <button class="btn" onclick="alert('連結至你的 Google Drive 或檔案')">下載報告</button>
            </div>

            <div class="card">
                <h3>使用者經驗設計實務</h3>
                <p>分析電商 App 的購物流程，優化後提升了 15% 的轉化率。</p>
                <button class="btn">查看詳情</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 我的報告作品集. 使用 HTML/CSS 建立.</p>
    </footer>

</body>
</html>
